<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scan QR</title>
<link rel="icon" type="image/png" href="qr.png">
<link rel="apple-touch-icon" href="qr.png">
<link rel="manifest" href="manifest.json">

<style>
  body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;   /* ← DETTE ER FIXET */
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(to bottom, #4f7df3, #89a7f5, #d2dcfb);
}

  img {
    max-width: 80%;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  
.qr-button {
  display: block;
  padding: 1rem 1.5rem;
  margin: 0 auto 2rem;
  border-radius: 12px;
  background: #0a66c2;
  color: white;
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 600;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  transition: 0.2s;
}

.qr-button:hover {
  background: #004182;
  transform: translateY(-2px);
}
</style>
</head>

<body>
  <a class="qr-button" href="https://actuomathias.github.io/">
    🙋‍♂️ Mathias Business Card
  </a>

  <img src="qr.png" alt="QR Code">
</body>

</html>
